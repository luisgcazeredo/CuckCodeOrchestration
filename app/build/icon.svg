<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Ícone do Maestri Próprio: dois terminais no quadro, ligados por uma corda. -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303036"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <clipPath id="recorte">
      <rect x="64" y="64" width="896" height="896" rx="208"/>
    </clipPath>
    <pattern id="grade" width="64" height="64" patternUnits="userSpaceOnUse" x="64" y="64">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="3"/>
    </pattern>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#fundo)"/>
  <rect x="64" y="64" width="896" height="896" fill="url(#grade)" clip-path="url(#recorte)"/>

  <!-- corda -->
  <path d="M 572 360 C 700 360, 668 430, 668 520" fill="none" stroke="#007AFF" stroke-width="22"
        stroke-linecap="round" stroke-dasharray="40 34"/>

  <!-- terminal de cima -->
  <g>
    <rect x="148" y="206" width="424" height="308" rx="46" fill="#1a1a1e" stroke="#46464c" stroke-width="10"/>
    <path d="M 194 206 H 526 A 46 46 0 0 1 572 252 V 272 H 148 V 252 A 46 46 0 0 1 194 206 Z" fill="#3a3a3e"/>
    <circle cx="198" cy="240" r="11" fill="#ff5f57"/>
    <circle cx="236" cy="240" r="11" fill="#febc2e"/>
    <circle cx="274" cy="240" r="11" fill="#28c840"/>
    <path d="M 210 340 L 262 384 L 210 428" fill="none" stroke="#e6e6ea" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="290" y="410" width="110" height="24" rx="12" fill="#e6e6ea"/>
  </g>

  <!-- terminal de baixo -->
  <g>
    <rect x="452" y="520" width="424" height="308" rx="46" fill="#1a1a1e" stroke="#46464c" stroke-width="10"/>
    <path d="M 498 520 H 830 A 46 46 0 0 1 876 566 V 586 H 452 V 566 A 46 46 0 0 1 498 520 Z" fill="#3a3a3e"/>
    <circle cx="502" cy="554" r="11" fill="#ff5f57"/>
    <circle cx="540" cy="554" r="11" fill="#febc2e"/>
    <circle cx="578" cy="554" r="11" fill="#28c840"/>
    <path d="M 514 654 L 566 698 L 514 742" fill="none" stroke="#007AFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="594" y="724" width="110" height="24" rx="12" fill="#007AFF"/>
  </g>
</svg>
